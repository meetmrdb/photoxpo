<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoxpo PROTOTYPE v2 – home, history, photo view</title>
<!--
  PROTOTYPE, THROWAWAY. Wayfinder ticket "Prototype the home screen, gallery and Load flow", round 2.
  Round 1 offered three layouts (A / B / C, see git history). Round 2 builds on the user's pick:
    - Home and Photos from A, plus a "Last backed up" line and a Backup history screen (C's months, plus other groupings).
    - History is kept on the Archive Drive; the phone shows its last known copy when the drive is out.
    - Photo view (B-style full-bleed): icon buttons for Share, Info, Load, and Remove from phone.
      Load swaps the Preview for the Original in place and says it is now on the phone.
  All photos are drawn placeholders. No persistence. Nothing here is product code.
-->
<style>
:root{
  --p:#0B5C63;--on-p:#fff;--pc:#C4EBEA;--on-pc:#00201F;
  --sc:#CCE8E5;--on-sc:#05201E;
  --bg:#F6FAF9;--surf:#EAF1F0;--surf-hi:#DDE7E6;--on:#161D1D;--var:#3F4948;
  --outline:#6F7978;--outv:#BEC9C8;
  --err:#B3261E;--errc:#F9DEDC;--on-errc:#410E0B;
  --warn:#FFDEA1;--on-warn:#3E2D00;
  --scrim:rgba(10,16,16,.62);
  --fs:1;
  --ease:cubic-bezier(.16,1,.3,1);
}
body[data-theme=dark]{
  --p:#7BD5DA;--on-p:#003739;--pc:#004F53;--on-pc:#C4EBEA;
  --sc:#2F4B49;--on-sc:#CCE8E5;
  --bg:#0E1514;--surf:#192020;--surf-hi:#252D2D;--on:#DDE4E3;--var:#BEC9C8;
  --outline:#889392;--outv:#3F4948;
  --err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;
  --warn:#5A4300;--on-warn:#FFDEA1;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;background:#cfd8d7;color:#162020;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;padding:20px 16px 40px}
body[data-theme=dark]{background:#0a0f0f;color:#dde4e3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}

/* ---------- prototype controls (not part of the app) ---------- */
#panel{width:290px;background:#fff;border:2px dashed #7a8a89;border-radius:14px;padding:16px;color:#162020;font-size:13px}
body[data-theme=dark] #panel{background:#151c1c;color:#dde4e3;border-color:#556}
#panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#a33;margin-bottom:10px}
#panel h3{font-size:13px;margin:14px 0 6px}
#panel .row{display:flex;flex-direction:column;gap:6px}
#panel button.pre{padding:9px 10px;border-radius:8px;border:1px solid #9aa;text-align:left;min-height:40px}
#panel button.pre[aria-pressed=true]{background:#0B5C63;color:#fff;border-color:#0B5C63}
#panel label{display:flex;gap:8px;align-items:center;min-height:32px}
#panel pre{font:11px/1.35 ui-monospace,monospace;background:#0001;padding:8px;border-radius:8px;white-space:pre-wrap;margin-top:8px}
#panel .big{padding:10px;border-radius:8px;background:#0B5C63;color:#fff;min-height:44px;width:100%}
#panel .note{opacity:.75;margin-top:8px;font-size:12px}

/* ---------- phone ---------- */
#stage{width:412px;height:892px;transform-origin:top center;flex:none;order:-1}
#phone{width:412px;height:892px;border-radius:44px;background:#000;padding:10px;box-shadow:0 18px 40px #0004,0 0 0 2px #2a2f2f}
#screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);color:var(--on);display:flex;flex-direction:column}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:500}
.sb i{display:inline-block;width:16px;height:9px;border:1.5px solid currentColor;border-radius:3px;margin-left:6px;vertical-align:-1px}
.gesture{height:22px;flex:none;display:flex;justify-content:center;align-items:center}
.gesture b{width:120px;height:4px;border-radius:2px;background:var(--on);opacity:.5}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--outv) transparent}
::selection{background:var(--pc);color:var(--on-pc)}

.hs{font-size:calc(26px*var(--fs));line-height:1.2;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.tl{font-size:calc(22px*var(--fs));line-height:1.25;font-weight:500}
.tm{font-size:calc(16px*var(--fs));line-height:1.4;font-weight:500}
.bl{font-size:calc(16px*var(--fs));line-height:1.45}
.bm{font-size:calc(14px*var(--fs));line-height:1.4}
.lm{font-size:calc(12px*var(--fs));line-height:1.3;font-weight:500;letter-spacing:.02em}
.var{color:var(--var)}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:28px;font-size:calc(16px*var(--fs));font-weight:500;background:var(--p);color:var(--on-p);width:100%;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.text{background:none;color:var(--p);min-height:48px;width:auto;padding:0 16px}
.btn.sm{min-height:48px;width:auto;padding:0 20px;font-size:calc(14px*var(--fs))}
.btn[disabled]{background:var(--surf-hi);color:var(--var);cursor:default}
.btn.err{background:var(--err);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:10px;background:var(--surf);font-size:calc(14px*var(--fs));font-weight:500}
.chip.ok{background:var(--pc);color:var(--on-pc)}
.chip.warn{background:var(--warn);color:var(--on-warn)}
.prog{height:8px;border-radius:4px;background:var(--surf-hi);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--p);border-radius:4px;transition:width .3s linear}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;font-size:calc(14px*var(--fs));font-weight:500}
.seg button[aria-pressed=true]{background:var(--sc);color:var(--on-sc)}
.appbar{display:flex;align-items:center;gap:8px;min-height:64px;padding:0 8px 0 20px;flex:none}
.appbar.back{padding-left:4px}
.appbar .tl{flex:1}
.iconbtn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:24px}

.nav{display:flex;flex:none;background:var(--surf);height:80px;padding-top:12px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(12px*var(--fs));font-weight:500;color:var(--var)}
.nav button span.pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav button[aria-current=page]{color:var(--on)}
.nav button[aria-current=page] span.pill{background:var(--pc);color:var(--on-pc)}

.gh{padding:20px 16px 8px;font-size:calc(14px*var(--fs));font-weight:500;color:var(--var);position:sticky;top:0;background:var(--bg);z-index:2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surf);border-radius:2px;display:block;padding:0}
.tile svg.sc{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:12px;background:var(--scrim);color:#fff;display:flex;align-items:center;justify-content:center}
.badge svg{width:15px;height:15px;stroke-width:2.2}
.vid{position:absolute;left:5px;bottom:5px;height:22px;padding:0 7px;border-radius:11px;background:var(--scrim);color:#fff;font-size:11px;display:flex;align-items:center;gap:3px;font-weight:500}
.vid svg{width:10px;height:10px;fill:#fff;stroke:none}
.legend{padding:12px 16px 24px;color:var(--var);display:flex;gap:8px;align-items:center}
.legend .badge{position:static;flex:none}
.sample{padding:10px 16px 0;color:var(--var)}

.card{background:var(--surf);border-radius:20px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.pad{padding:8px 20px 24px}
.rowcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surf);border-radius:20px;padding:14px 16px;min-height:64px}
.rowcard .tx{flex:1;min-width:0}
.lastline{display:flex;align-items:center;gap:8px;color:var(--var)}
.lastline svg{width:20px;height:20px}

/* history */
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:88px}
.mrow:active{background:var(--surf)}
.mrow .strip4{display:flex;gap:2px;width:112px;flex:none;border-radius:10px;overflow:hidden}
.mrow .strip4 span{position:relative;width:28px;height:56px;display:block}
.mrow .strip4 svg{position:absolute;inset:0;width:100%;height:100%}
.mrow .tx{flex:1;min-width:0}
.mstate{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-weight:500;font-size:calc(14px*var(--fs))}
.mstate.ok{color:var(--p)}
.mstate.wait{color:var(--on-warn);background:var(--warn);padding:2px 10px 2px 6px;border-radius:10px}
.mstate.bad{color:var(--on-errc);background:var(--errc);padding:2px 10px 2px 6px;border-radius:10px}
.brow{display:flex;gap:14px;padding:14px 20px;align-items:flex-start}
.brow .dot{width:40px;height:40px;border-radius:20px;background:var(--pc);color:var(--on-pc);display:flex;align-items:center;justify-content:center;flex:none}
.hnote{margin:4px 16px 8px;padding:12px 14px;border-radius:14px;background:var(--surf);display:flex;gap:10px;align-items:flex-start}

/* photo view */
.viewer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:#000;color:#fff}
.viewer .photo{position:absolute;inset:0;overflow:hidden}
.viewer .photo svg.sc{position:absolute;inset:0;width:100%;height:100%}
.viewer .photo.pv svg.sc{filter:blur(3px);transform:scale(1.04)}
.viewer .photo.sharpen svg.sc{animation:sharpen .9s var(--ease)}
@keyframes sharpen{from{filter:blur(3px);transform:scale(1.04)}to{filter:none;transform:none}}
.viewer .top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;padding:6px 8px;background:linear-gradient(#000b,#0000);height:96px;align-items:flex-start}
.viewer .top .tm{margin:12px 0 0 4px;flex:1}
.viewer .tag{margin:12px 8px 0 0;height:28px;padding:0 10px;border-radius:14px;background:var(--scrim);display:flex;align-items:center;font-size:12px;font-weight:500}
.viewer .bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:72px 16px 12px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#0000,#000c 45%)}
.viewer .chip{background:var(--scrim);color:#fff;align-self:flex-start}
.viewer .chip.ok{background:#0b5c63cc}
.actions{display:flex;justify-content:space-around;gap:4px;padding-bottom:4px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;min-height:80px;font-size:calc(12px*var(--fs));font-weight:500;color:#fff;text-align:center}
.act .ring{width:56px;height:56px;border-radius:28px;background:#ffffff26;display:flex;align-items:center;justify-content:center;transition:background .2s}
.act:active .ring{background:#ffffff44}
.act.main .ring{background:#7BD5DA;color:#003739}
.act[disabled]{opacity:.5;cursor:default}
.act[disabled] .ring{background:#ffffff1a;color:#fff}
.loadcard{border-radius:20px;padding:14px 16px;background:#1d2424ee;color:#eef;display:flex;flex-direction:column;gap:12px}
.loadcard .prog{background:#ffffff30}.loadcard .prog>i{background:#7BD5DA}
.loadcard.err{background:var(--errc);color:var(--on-errc)}
.hint{display:flex;gap:10px;align-items:flex-start}
.fresh{animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

/* sheets, dialogs, toast */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.dim.center{align-items:center;justify-content:center}
.bsheet{background:var(--bg);color:var(--on);width:100%;border-radius:28px 28px 0 0;padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sysdlg{background:#f1f1f1;color:#111;margin:0 28px;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px;width:100%}
.sysdlg .mock{font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.55}
.sysdlg .row2{display:flex;justify-content:flex-end;gap:8px}
.sysdlg button{min-height:48px;padding:0 18px;border-radius:24px;font-weight:500;color:#1a56b0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--var)}
.kv dd{overflow-wrap:anywhere}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.targets button{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:80px;font-size:calc(12px*var(--fs));font-weight:500}
.targets .ring{width:56px;height:56px;border-radius:28px;background:var(--sc);color:var(--on-sc);display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:12px;right:12px;bottom:92px;z-index:30;background:#2b3333;color:#eef;border-radius:8px;padding:14px 16px;font-size:calc(14px*var(--fs))}
body.viewing .toast{bottom:auto;top:96px}
body[data-theme=dark] .toast{background:#dde4e3;color:#162020}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside id="panel" aria-label="Prototype controls">
  <h2>Prototype controls, not part of the app</h2>
  <h3>Jump to a state</h3>
  <div class="row" id="presets"></div>
  <h3>Hardware</h3>
  <button class="big" data-act="plug" id="plugbtn"></button>
  <h3>Options</h3>
  <label><input type="checkbox" data-opt="build1"> Build 1: hide delete actions (Remove from phone, Free up space)</label>
  <label><input type="checkbox" data-opt="failNext"> Next backup: 2 files fail verification</label>
  <label><input type="checkbox" data-opt="big"> Large text (130%)</label>
  <label><input type="checkbox" data-opt="dark"> Dark theme</label>
  <h3>State</h3>
  <pre id="dump"></pre>
  <p class="note">Photos are drawn placeholders. Grids show a sample of each month; counts are made up (1,204 backed up + 142 new). Tip: tiles with a drive badge have their Original only on the drive; others are on the phone.</p>
</aside>

<div id="stage"><div id="phone"><div id="screen"></div></div></div>

<script>
/* ============ data ============ */
const MONTHS = [
  {k:'2026-10',name:'October 2026',idx:9,n:18,count:142},
  {k:'2026-09',name:'September 2026',idx:8,n:12,count:247},
  {k:'2026-08',name:'August 2026',idx:7,n:12,count:405},
  {k:'2026-07',name:'July 2026',idx:6,n:12,count:340},
  {k:'2026-06',name:'June 2026',idx:5,n:12,count:212},
];
const HISTORY0=[
  {when:'Wed 7 Oct, 8:15 pm',n:98,gb:2.4},
  {when:'Sat 3 Oct, 7:02 pm',n:131,gb:3.1},
  {when:'Sun 27 Sep, 9:40 pm',n:212,gb:5.4},
  {when:'Sun 30 Aug, 6:12 pm',n:247,gb:6.2},
  {when:'Tue 28 Jul, 8:30 pm',n:340,gb:8.5},
  {when:'Mon 15 Jun, 7:45 pm',n:176,gb:4.4},
];
const PALS=[['#F6C177','#EB8F5A','#2F5D62','#1D3B3F'],['#BFE3F5','#8CC4E8','#4C8C5B','#2E5E3B'],['#2B3A67','#6D5C9C','#E07A5F','#1B1F3B'],['#F4E3C1','#E0B88B','#8A6F5A','#5C4636'],['#CFE8D5','#9BCBA7','#3D7A66','#245244'],['#FFD6C0','#F4A6A0','#7C6A9B','#4B3F72']];
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const sceneCache={};
function scene(id){
  if(sceneCache[id])return sceneCache[id];
  const r=rng(id*7919+13),p=PALS[Math.floor(r()*PALS.length)];
  const sx=15+r()*70,sy=14+r()*26,sr=7+r()*8;
  const h1=48+r()*22,h2=64+r()*18;
  const hill=(y,a)=>`M0 ${y} Q ${20+r()*20} ${y-a} 50 ${y-a/3} T 100 ${y-a/2} V100 H0Z`;
  const bld=r()>.55?`<rect x="${58+r()*22}" y="${h1-10}" width="${9+r()*6}" height="14" fill="${p[3]}" opacity=".85"/>`:'';
  return sceneCache[id]=`<svg class="sc" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${id})"/><circle cx="${sx}" cy="${sy}" r="${sr}" fill="#fff" opacity=".8"/><path d="${hill(h1,16)}" fill="${p[2]}"/>${bld}<path d="${hill(h2,12)}" fill="${p[3]}"/></svg>`;
}
const ITEMS=[];
(function(){
  let id=1;
  for(const m of MONTHS){
    for(let i=0;i<m.n;i++){
      const day=Math.max(1,28-Math.floor(i*(m.n>12?1.4:2.2)));
      const isVid=((id*37)%9)===0;
      const d=new Date(2026,m.idx,Math.min(day,m.k==='2026-10'?11:28),9+(id%9),(id*13)%60,(id*29)%60);
      const p2=n=>String(n).padStart(2,'0');
      ITEMS.push({id:id++,m:m.k,mi:i,date:d,vid:isVid,
        name:`${isVid?'VID':'IMG'}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.${isVid?'mp4':'jpg'}`,
        mb:isVid?Math.round(60+((id*17)%120)):+(3.2+((id*7)%36)/10).toFixed(1),
        dur:isVid?`0:${p2(8+(id%40))}`:null,
        onPhone:m.k==='2026-10'||(m.k==='2026-09'&&i<5)});
    }
  }
})();
const byId=id=>ITEMS.find(x=>x.id===id);
const fmtDay=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtLong=d=>d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'});

/* ============ icons ============ */
const P={
 drive:'<rect x="3" y="12" width="18" height="8" rx="2"/><path d="M5 12l2-7h10l2 7"/><path d="M16.5 16h.01" stroke-width="3"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 pause:'<path d="M9 6v12M15 6v12"/>',
 photos:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-5 4 4 3-3 6 6"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
 refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>',
 plug:'<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 01-10 0zM12 16v5"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
 share:'<circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 more:'<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',
};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''} aria-hidden="true">${P[n]}</svg>`;

/* ============ state ============ */
const TOTAL=1346, BASE=1204;
const S={
  drive:'out',phase:'idle',pausedBy:null,newTotal:142,copied:0,failed:0,
  last:{when:'Wed 7 Oct, 8:15 pm',ago:'4 days ago'},
  history:HISTORY0.slice(),
  loads:{},tab:'home',hist:false,histTab:'month',month:null,typeF:null,photo:null,sheet:null,toast:null,preset:'out',
  opts:{build1:false,failNext:false,big:false,dark:false},
};
const PRESETS=[
 ['out','Drive not connected, 142 new waiting'],
 ['ready','Drive connected, ready to back up'],
 ['copying','Backing up (48 of 142)'],
 ['pulled','Drive pulled mid-backup'],
 ['verify','Verification failed on 2 files'],
 ['done','All backed up'],
];
function applyPreset(k){
  S.preset=k;S.sheet=null;S.toast=null;S.loads={};S.photo=null;
  Object.assign(S,{drive:'in',phase:'idle',pausedBy:null,newTotal:142,copied:0,failed:0});
  S.history=HISTORY0.slice();S.last={when:'Wed 7 Oct, 8:15 pm',ago:'4 days ago'};
  ITEMS.forEach(i=>{if(i.m==='2026-10'||(i.m==='2026-09'&&i.mi<5))i.onPhone=true});
  if(k==='out')S.drive='out';
  if(k==='copying'){S.phase='copying';S.copied=48}
  if(k==='pulled'){S.drive='out';S.phase='paused';S.pausedBy='pulled';S.copied=48}
  if(k==='verify'){S.phase='verifyFail';S.copied=140;S.failed=2}
  if(k==='done'){S.phase='done';S.copied=142;finishBackup(true)}
  render();
}
function finishBackup(silent){
  S.last={when:'Today, 9:41 am',ago:'just now'};
  S.history.unshift({when:'Today, 9:41 am',n:S.newTotal,gb:3.6});
}

/* ============ derived ============ */
const left=()=>S.newTotal-S.copied-S.failed;
const onPhone=it=>it.onPhone||(S.loads[it.id]&&S.loads[it.id].s==='done');
function isBacked(it){
  if(it.m!=='2026-10')return true;
  const frac=S.phase==='done'||left()<=0?1:S.copied/S.newTotal;
  return (17-it.mi)<Math.round(frac*18);
}
function status(){
  const drive=S.drive==='in', L=left(), total=S.newTotal;
  if(S.phase==='copying')return{title:`Backing up… ${S.copied} of ${total}`,sub:'Keep your drive plugged in.',progress:S.copied/total,pause:true};
  if(S.phase==='paused'){
    const prog=S.copied/total;
    if(!drive)return{title:'Your drive was unplugged',sub:`${S.copied} of ${total} are safe on it. Plug it back in to continue.`,progress:prog,primary:{label:'Waiting for your drive',disabled:true,icon:'plug'}};
    if(S.pausedBy==='pulled')return{title:'Your drive is back',sub:`Continue where you left off: ${S.copied} of ${total} are done.`,progress:prog,primary:{label:'Continue',act:'resume'}};
    return{title:`Paused at ${S.copied} of ${total}`,sub:'Nothing is lost. Continue when you like.',progress:prog,primary:{label:'Continue',act:'resume'}};
  }
  if(S.phase==='verifyFail')return{title:`${S.copied} backed up, ${S.failed} need another try`,sub:'Those 2 are still on your phone. Nothing was lost.',primary:{label:'Try again',act:'retry',icon:'refresh'}};
  if(S.phase==='done'||L<=0)return{title:`All ${TOTAL.toLocaleString()} photos are backed up`,sub:drive?'Checked just now.':'Plug in your drive after you take more photos.',done:true,free:!S.opts.build1};
  return drive
   ?{title:`${L} new photos to back up`,sub:`3.6 GB · about ${Math.round(L*.28)} minutes`,primary:{label:'Back up now',act:'backup',icon:'drive'}}
   :{title:`${L} new photos waiting`,sub:'Plug in your drive to back them up.',primary:{label:'Plug in your drive',disabled:true,icon:'plug'}};
}
function monthState(m){
  if(m.k!=='2026-10')return{kind:'ok',text:'All backed up'};
  if(S.failed)return{kind:'bad',text:`${S.failed} need another try`};
  if(S.phase==='done'||left()<=0)return{kind:'ok',text:'All backed up'};
  if(S.copied>0)return{kind:'wait',text:`${S.copied} of ${S.newTotal} backed up`};
  return{kind:'wait',text:`${S.newTotal} not backed up yet`};
}
function where(it){
  const ld=S.loads[it.id];
  if(ld&&ld.s==='done')return'Original loaded · on this phone and your drive';
  if(!it.onPhone)return'Original is on your drive';
  return isBacked(it)?'On this phone and safe on your drive':'Only on this phone so far';
}

/* ============ small renderers ============ */
const primaryBtn=p=>p?`<button class="btn" ${p.disabled?'disabled':`data-act="${p.act}"`}>${p.icon?ic(p.icon):''}${p.label}</button>`:'';
const prog=f=>`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f*100)}"><i style="width:${Math.round(f*100)}%"></i></div>`;
const driveChip=()=>S.drive==='in'
  ?`<span class="chip ok">${ic('drive',20)}Drive connected</span>`
  :`<span class="chip">${ic('plug',20)}Drive not connected</span>`;
function tile(it){
  const off=!onPhone(it);
  return `<button class="tile" data-act="photo" data-id="${it.id}" aria-label="${it.vid?'Video':'Photo'}, ${fmtDay(it.date)}${off?', Original is on your drive':''}">${scene(it.id)}${it.vid?`<span class="vid"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${it.dur}</span>`:''}${off?`<span class="badge" aria-hidden="true">${ic('drive')}</span>`:''}</button>`;
}
const legend=()=>`<div class="legend lm"><span class="badge">${ic('drive')}</span><span>Original is on your drive. Tap a photo to see it or Load it.</span></div>`;
function grouped(items,mode){
  const groups=[];
  for(const it of items){
    const key=mode==='day'?fmtDay(it.date):MONTHS.find(m=>m.k===it.m).name;
    const g=groups[groups.length-1];
    if(g&&g.key===key)g.items.push(it);else groups.push({key,items:[it]});
  }
  return groups.map(g=>`<div class="gh">${g.key}</div><div class="grid">${g.items.map(tile).join('')}</div>`).join('')+legend();
}
const msIcon=k=>k==='ok'?ic('check',18):ic(k==='bad'?'alert':'drive',18);
const mstate=ms=>`<span class="mstate ${ms.kind}">${msIcon(ms.kind)}${ms.text}</span>`;

/* ============ screens ============ */

    <button class="rowcard" data-act="hist">${ic('clock')}<div class="tx"><div class="tm">Backup history</div><div class="bm var">By month, by backup, photos and videos</div></div>${ic('chev')}</button>

function photosTab(){

}
function history(){
  if(S.month){
    const m=MONTHS.find(x=>x.k===S.month);

  if(S.typeF){
    const v=S.typeF==='video';

  }
  const drive=S.drive==='in';
  const note=`<div class="hnote">${ic('drive',22)}<div class="bm"><b>Saved on your drive.</b> ${drive?'Up to date with your drive.':`Showing what your phone last read from it, ${S.last.ago}. Plug in your drive to refresh.`}</div></div>`;
  let body='';
  if(S.histTab==='month'){
    body=MONTHS.map(m=>{

    }).join('');
  }else if(S.histTab==='backup'){
    body=S.history.map((h,i)=>`<div class="brow"><span class="dot">${ic('check',20)}</span><div><div class="tm">${h.when}</div><div class="bm var">${h.n} photos and videos · ${h.gb} GB</div><div class="bm" style="color:var(--p);font-weight:500">Checked and matched</div></div></div>`).join('')
      +(S.phase==='copying'?`<div class="brow"><span class="dot" style="background:var(--warn);color:var(--on-warn)">${ic('drive',20)}</span><div><div class="tm">Now</div><div class="bm var">${S.copied} of ${S.newTotal} so far</div></div></div>`:'');
  }else{

    body=`<button class="mrow" data-act="type" data-t="photo"><div class="strip4">${th(false)}</div><div class="tx"><div class="tm">Photos</div><div class="bm var">1,189 items</div></div>${ic('chev')}</button>
          <button class="mrow" data-act="type" data-t="video"><div class="strip4">${th(true)}</div><div class="tx"><div class="tm">Videos</div><div class="bm var">157 items</div></div>${ic('chev')}</button>`;
  }
  const seg=`<div style="padding:0 16px 8px"><div class="seg" role="group" aria-label="History by">${[['month','By month'],['backup','By backup'],['type','By type']].map(([k,l])=>`<button data-act="histTab" data-k="${k}" aria-pressed="${S.histTab===k}">${l}</button>`).join('')}</div></div>`;
  return `<div class="appbar back"><button class="iconbtn" data-act="closeHist" aria-label="Back">${ic('back')}</button><h2 class="tl">Backup history</h2></div>
  <div class="scroll" id="sc">${note}${seg}${body}</div>`;
}

/* ============ photo view ============ */
function viewer(){
  const it=byId(S.photo);if(!it)return'';
  const ld=S.loads[it.id]||{s:'idle',pct:0};
  const here=onPhone(it), drive=S.drive==='in', backed=isBacked(it);
  const size=`${it.mb} MB`;
  const loading=ld.s==='loading', lerr=ld.s==='error';
  let card='';
  if(!here){
    if(loading)card=`<div class="loadcard" role="status"><div class="tm">Loading Original… ${Math.round(ld.pct)}%</div>${prog(ld.pct/100)}<button class="btn tonal sm" style="align-self:flex-start" data-act="cancelLoad" data-id="${it.id}">Cancel</button></div>`;
    else if(lerr)card=`<div class="loadcard err" role="alert"><div class="hint">${ic('alert')}<div><div class="tm">Your drive was unplugged</div><div class="bm">Plug it back in, then tap Load to try again. Nothing was changed on your phone.</div></div></div></div>`;
    else if(!drive)card=`<div class="loadcard"><div class="hint bm">${ic('plug',22)}<span>Connect your drive to Load the Original. What you see here is the small Preview your phone keeps.</span></div></div>`;
  }
  const photoCls=here?(fresh('o')?'sharpen':''):'pv';
  let act3;
  if(!here){
    act3=`<button class="act main" data-act="load" data-id="${it.id}" ${(!drive||loading)?'disabled':''} aria-label="Load Original, ${size}"><span class="ring">${ic('down')}</span>Load · ${size}</button>`;
  }else if(!S.opts.build1&&backed){
    act3=`<button class="act" data-act="removeAsk" aria-label="Remove from this phone"><span class="ring">${ic('trash')}</span>Remove from phone</button>`;
  }else{
    act3=`<span class="act" style="opacity:.0;pointer-events:none"></span>`;
  }
  const chip=`<span class="chip ${here&&backed?'ok':''}">${ic(!here?'drive':backed?'check':'alert',20)}${where(it)}</span>`;
  return `<div class="viewer ${fresh('v')}">
    <div class="photo ${photoCls}">${scene(it.id)}${it.vid?`<span class="vid" style="left:auto;right:12px;bottom:200px"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${it.dur}</span>`:''}</div>
    <div class="top"><button class="iconbtn" data-act="closeViewer" aria-label="Back">${ic('back')}</button><div class="tm">${it.vid?'Video':'Photo'} · ${fmtDay(it.date)}</div>${here?'':'<span class="tag">Preview</span>'}</div>
    <div class="bottom">${chip}${card}
      <div class="actions">
        <button class="act" data-act="share" aria-label="Share"><span class="ring">${ic('share')}</span>Share</button>
        <button class="act" data-act="info" aria-label="Photo info"><span class="ring">${ic('info')}</span>Info</button>
        ${act3}
      </div></div></div>`;
}

/* ============ sheets ============ */
function sheet(){
  const k=S.sheet;if(!k)return'';
  const it=byId(S.photo);
  const n=BASE+S.copied;
  const wrap=(inner,cls='')=>`<div class="dim ${cls}" data-act="closeSheet"><div class="bsheet ${fresh('s')}" role="dialog" data-act="noop">${inner}</div></div>`;
  if(k==='free1')return wrap(`<h2 class="tl">Free up space on this phone?</h2>
    <p class="bl">${n.toLocaleString()} photos and videos are safely on your drive and checked. This removes their big Originals from your phone. The small Previews stay, and you can Load any Original later.</p>
    <p class="bm var">Android will ask you to confirm before anything is removed.</p>
    <button class="btn" data-act="freeConfirm">Remove ${n.toLocaleString()} Originals · 38 GB</button>
    <button class="btn text" style="align-self:center" data-act="closeSheet">Not now</button>`);
  if(k==='free2')return wrap(`<div style="display:flex;gap:12px;align-items:center">${ic('check',32)}<h2 class="tl">38 GB freed</h2></div>
    <p class="bl">Your phone has more room. Your photos are all still here as Previews.</p>
    <button class="btn" data-act="closeSheet">Done</button>`);

  if(k==='info'){
    const here=onPhone(it);
    return wrap(`<h2 class="tl">${it.vid?'Video':'Photo'} info</h2>
    <dl class="kv bm">
      <dt>Taken</dt><dd>${fmtLong(it.date)}</dd>
      <dt>File name</dt><dd>${it.name}</dd>
      <dt>Original</dt><dd>${it.mb} MB${it.vid?'':' · 4000 × 3000'}</dd>
      <dt>Preview</dt><dd>${it.vid?'Poster frame':'about 180 KB · 720 px'}</dd>
      <dt>Original is</dt><dd>${here?'on this phone':'on your drive only'}</dd>
      <dt>Backed up</dt><dd>${isBacked(it)?'Yes, copied and checked':'Not yet'}</dd>
      <dt>Drive folder</dt><dd>Photoxpo/Originals/${it.m.slice(0,4)}/${it.m}/</dd>
    </dl>
    <p class="lm var">Sample values for the prototype.</p>
    <button class="btn tonal" data-act="closeSheet">Close</button>`);
  }
  if(k==='share'){
    if(onPhone(it))return wrap(`<h2 class="tl">Share</h2>
      <p class="bm var">Sends the Original (${it.mb} MB).</p>
      <div class="targets">
        <button data-act="shared" data-to="Messages"><span class="ring">${ic('chat')}</span>Messages</button>
        <button data-act="shared" data-to="Mail"><span class="ring">${ic('mail')}</span>Mail</button>
        <button data-act="shared" data-to="Nearby"><span class="ring">${ic('share')}</span>Nearby</button>
        <button data-act="shared" data-to="More"><span class="ring">${ic('more')}</span>More</button>
      </div>`);
    return wrap(`<h2 class="tl">Share this photo</h2>
      <p class="bl">Only the small Preview is on this phone. The Original is on your drive.</p>
      <button class="btn" data-act="shared" data-to="the Preview">${ic('share')}Share the Preview</button>
      ${drive3()?`<button class="btn tonal" data-act="loadFromShare" data-id="${it.id}">${ic('down')}Load Original first · ${it.mb} MB</button>`:`<button class="btn tonal" disabled>${ic('plug')}Connect your drive to share the Original</button>`}`);
  }
  if(k==='remove')return wrap(`<h2 class="tl">Remove from this phone?</h2>
    <p class="bl">The Original (${it.mb} MB) leaves your phone. It stays safe on your drive and the Preview stays here. You can Load it again any time.</p>
    <button class="btn err" data-act="removeGo">${ic('trash')}Remove from phone</button>
    <button class="btn text" style="align-self:center" data-act="closeSheet">Keep it</button>`);
  if(k==='sys')return `<div class="dim center" data-act="noop"><div class="sysdlg ${fresh('s')}" role="alertdialog"><div class="mock">Android system dialog (mock)</div><div style="font-size:18px;font-weight:500">Allow Photoxpo to delete this ${it.vid?'video':'photo'}?</div><div class="row2"><button data-act="closeSheet">Don't allow</button><button data-act="removeDone">Allow</button></div></div></div>`;
  return'';
}
const drive3=()=>S.drive==='in';
const toast=()=>S.toast?`<div class="toast ${fresh('t')}" role="status">${S.toast}</div>`:'';

/* ============ render ============ */
const ANIM=new Set();
const fresh=k=>ANIM.has(k)?'fresh':'';
function render(){
  document.body.dataset.theme=S.opts.dark?'dark':'light';
  document.body.classList.toggle('viewing',!!S.photo);
  document.documentElement.style.setProperty('--fs',S.opts.big?1.3:1);
  const scr=document.getElementById('screen');
  const old=scr.querySelector('#sc'); const top=old?old.scrollTop:0;
  const inHist=S.tab==='home'&&S.hist;
  const main=inHist?history():S.tab==='home'?home():photosTab();
  scr.innerHTML=`<div class="sb"><span>9:41</span><span>5G<i></i></span></div>${main}
    <nav class="nav" aria-label="Main">
     <button data-act="tab" data-t="home" ${S.tab==='home'?'aria-current="page"':''}><span class="pill">${ic('home')}</span>Home</button>
     <button data-act="tab" data-t="photos" ${S.tab==='photos'?'aria-current="page"':''}><span class="pill">${ic('photos')}</span>Photos</button>
    </nav><div class="gesture"><b></b></div>`+viewer()+sheet()+toast();
  ANIM.clear();
  const nw=scr.querySelector('#sc'); if(nw)nw.scrollTop=top;
  document.getElementById('plugbtn').textContent=S.drive==='in'?'Unplug the drive':'Plug in the drive';
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===S.preset)));
  document.querySelectorAll('[data-opt]').forEach(c=>c.checked=!!S.opts[c.dataset.opt]);
  const it=S.photo&&byId(S.photo);
  document.getElementById('dump').textContent=JSON.stringify({drive:S.drive,phase:S.phase,copied:S.copied,failed:S.failed,waiting:Math.max(0,left()),last:S.last.when,
    screen:S.photo?`photo ${S.photo}`:inHist?`history/${S.month||S.typeF||S.histTab}`:S.tab,
    ...(it?{original:onPhone(it)?'on phone':'drive only',load:(S.loads[it.id]||{}).s||'-'}:{})},null,1);
}
function say(t){S.toast=t;ANIM.add('t');render();clearTimeout(say.t);say.t=setTimeout(()=>{S.toast=null;render()},2600)}

/* ============ actions ============ */
S.group='month';
const ACT={
  noop:()=>{},
  tab:d=>{S.tab=d.t;S.hist=false;S.month=null;S.typeF=null;render()},
  group:d=>{S.group=d.g;render()},
  hist:()=>{S.hist=true;render()},closeHist:()=>{S.hist=false;render()},
  histTab:d=>{S.histTab=d.k;render()},
  month:d=>{S.month=d.k;render()},type:d=>{S.typeF=d.t;render()},
  closeSub:()=>{S.month=null;S.typeF=null;render()},
  photo:d=>{S.photo=+d.id;ANIM.add('v');render()},closeViewer:()=>{S.photo=null;S.sheet=null;render()},
  backup:()=>{if(S.drive!=='in')return;S.phase='copying';S.pausedBy=null;render()},
  pause:()=>{S.phase='paused';S.pausedBy='user';render()},
  resume:()=>{if(S.drive!=='in')return;S.phase='copying';S.pausedBy=null;render()},
  retry:()=>{S.failed=0;S.phase='copying';render()},
  plug:()=>{
    S.drive=S.drive==='in'?'out':'in';
    if(S.drive==='out'){
      if(S.phase==='copying'){S.phase='paused';S.pausedBy='pulled'}
      for(const k in S.loads)if(S.loads[k].s==='loading')S.loads[k]={s:'error',pct:S.loads[k].pct};
    }
    render();
  },
  load:d=>{if(S.drive!=='in')return;S.loads[d.id]={s:'loading',pct:0};render()},
  loadFromShare:d=>{S.sheet=null;ACT.load(d)},
  cancelLoad:d=>{delete S.loads[d.id];render()},
  share:()=>{S.sheet='share';ANIM.add('s');render()},
  shared:d=>{S.sheet=null;say(`Shared ${d.to==='the Preview'?'the Preview':'the Original'} via ${d.to} (mock)`)},
  info:()=>{S.sheet='info';ANIM.add('s');render()},
  removeAsk:()=>{S.sheet='remove';ANIM.add('s');render()},
  removeGo:()=>{S.sheet='sys';ANIM.add('s');render()},
  removeDone:()=>{const it=byId(S.photo);it.onPhone=false;delete S.loads[it.id];S.sheet=null;say('Removed from this phone. Still safe on your drive.')},
  closeSheet:()=>{S.sheet=null;render()},
  freeStart:()=>{S.sheet='free1';ANIM.add('s');render()},freeConfirm:()=>{S.sheet='free2';ANIM.add('s');render()},
};
document.addEventListener('click',e=>{
  const p=e.target.closest('#presets button');if(p){applyPreset(p.dataset.p);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset);
});
document.addEventListener('change',e=>{
  const o=e.target.dataset&&e.target.dataset.opt;if(!o)return;
  S.opts[o]=e.target.checked;render();
});

/* ============ simulation tick ============ */
setInterval(()=>{
  let dirty=false;
  if(S.phase==='copying'&&S.drive==='in'){
    const stop=S.opts.failNext?S.newTotal-2:S.newTotal;
    S.copied=Math.min(stop,S.copied+3);
    if(S.opts.failNext&&S.copied>=stop){S.failed=2;S.phase='verifyFail';S.opts.failNext=false}
    else if(S.copied>=S.newTotal){S.phase='done';finishBackup()}
    dirty=true;
  }
  for(const k in S.loads){
    const l=S.loads[k];
    if(l.s==='loading'){
      l.pct=Math.min(100,l.pct+4);
      if(l.pct>=100){l.s='done';ANIM.add('o');say('Loaded. Find it in Gallery, Photoxpo Loaded.');dirty=false}
      else dirty=true;
    }
  }
  if(dirty)render();
},250);

/* ============ boot ============ */
document.getElementById('presets').innerHTML=PRESETS.map(([k,l])=>`<button class="pre" data-p="${k}" aria-pressed="false">${l}</button>`).join('');
function fit(){
  const k=Math.min(1,(innerHeight-40)/892,(innerWidth-32)/412);
  const st=document.getElementById('stage');
  st.style.transform=`scale(${k})`;st.style.marginBottom=`${(k-1)*892}px`;
}
addEventListener('resize',fit);fit();
render();
</script>
