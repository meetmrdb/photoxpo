<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoxpo PROTOTYPE – home, gallery, Load</title>
<!--
  PROTOTYPE, THROWAWAY. Answers wayfinder ticket "Prototype the home screen, gallery and Load flow".
  Question: what should the first screens look and behave like for Nandhu?
  Three structurally different variants on one phone-shaped page, switched with ?variant=A|B|C (or the bar / arrow keys).
    A  "One thing at a time": Home tab = one sentence + one button; Photos tab = the grid.
    B  "Photos first": the grid is home; a slim status strip rides on top.
    C  "By month": months are the home screen, each says whether it is Backed up.
  All photos are drawn placeholders. No persistence. Nothing here is product code.
-->
<style>
:root{
  --p:#0B5C63;--on-p:#fff;--pc:#C4EBEA;--on-pc:#00201F;
  --sc:#CCE8E5;--on-sc:#05201E;
  --bg:#F6FAF9;--surf:#EAF1F0;--surf-hi:#DDE7E6;--on:#161D1D;--var:#3F4948;
  --outline:#6F7978;--outv:#BEC9C8;
  --err:#B3261E;--errc:#F9DEDC;--on-errc:#410E0B;
  --warn:#FFDEA1;--on-warn:#3E2D00;
  --scrim:rgba(10,16,16,.62);
  --fs:1;
  --ease:cubic-bezier(.16,1,.3,1);
}
body[data-theme=dark]{
  --p:#7BD5DA;--on-p:#003739;--pc:#004F53;--on-pc:#C4EBEA;
  --sc:#2F4B49;--on-sc:#CCE8E5;
  --bg:#0E1514;--surf:#192020;--surf-hi:#252D2D;--on:#DDE4E3;--var:#BEC9C8;
  --outline:#889392;--outv:#3F4948;
  --err:#FFB4AB;--errc:#93000A;--on-errc:#FFDAD6;
  --warn:#5A4300;--on-warn:#FFDEA1;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;background:#cfd8d7;color:#162020;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;padding:20px 16px 90px}
body[data-theme=dark]{background:#0a0f0f;color:#dde4e3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}

/* ---------- prototype controls (not part of the app) ---------- */
#panel{width:290px;background:#fff;border:2px dashed #7a8a89;border-radius:14px;padding:16px;color:#162020;font-size:13px}
body[data-theme=dark] #panel{background:#151c1c;color:#dde4e3;border-color:#556}
#panel h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#a33;margin-bottom:10px}
#panel h3{font-size:13px;margin:14px 0 6px}
#panel .row{display:flex;flex-direction:column;gap:6px}
#panel button.pre{padding:9px 10px;border-radius:8px;border:1px solid #9aa;text-align:left;min-height:40px}
#panel button.pre[aria-pressed=true]{background:#0B5C63;color:#fff;border-color:#0B5C63}
#panel label{display:flex;gap:8px;align-items:center;min-height:32px}
#panel pre{font:11px/1.35 ui-monospace,monospace;background:#0001;padding:8px;border-radius:8px;white-space:pre-wrap;margin-top:8px}
#panel .big{padding:10px;border-radius:8px;background:#0B5C63;color:#fff;min-height:44px;width:100%}
#panel .note{opacity:.75;margin-top:8px;font-size:12px}

/* ---------- phone ---------- */
#stage{width:412px;height:892px;transform-origin:top center;flex:none;order:-1}
#phone{width:412px;height:892px;border-radius:44px;background:#000;padding:10px;box-shadow:0 18px 40px #0004,0 0 0 2px #2a2f2f}
#screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);color:var(--on);display:flex;flex-direction:column}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:500}
.sb i{display:inline-block;width:16px;height:9px;border:1.5px solid currentColor;border-radius:3px;margin-left:6px;vertical-align:-1px}
.gesture{height:22px;flex:none;display:flex;justify-content:center;align-items:center}
.gesture b{width:120px;height:4px;border-radius:2px;background:var(--on);opacity:.5}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--outv) transparent}
::selection{background:var(--pc);color:var(--on-pc)}

/* type scale (sp-like via --fs) */
.hs{font-size:calc(26px*var(--fs));line-height:1.2;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.tl{font-size:calc(22px*var(--fs));line-height:1.25;font-weight:500}
.tm{font-size:calc(16px*var(--fs));line-height:1.4;font-weight:500}
.bl{font-size:calc(16px*var(--fs));line-height:1.45}
.bm{font-size:calc(14px*var(--fs));line-height:1.4}
.lm{font-size:calc(12px*var(--fs));line-height:1.3;font-weight:500;letter-spacing:.02em}
.var{color:var(--var)}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:28px;font-size:calc(16px*var(--fs));font-weight:500;background:var(--p);color:var(--on-p);width:100%;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.text{background:none;color:var(--p);min-height:48px;width:auto;padding:0 16px}
.btn.sm{min-height:48px;width:auto;padding:0 20px;font-size:calc(14px*var(--fs))}
.btn[disabled]{background:var(--surf-hi);color:var(--var);cursor:default}
.btn.err{background:var(--err);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:10px;background:var(--surf);font-size:calc(14px*var(--fs));font-weight:500}
.chip.ok{background:var(--pc);color:var(--on-pc)}
.chip.warn{background:var(--warn);color:var(--on-warn)}
.prog{height:8px;border-radius:4px;background:var(--surf-hi);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--p);border-radius:4px;transition:width .3s linear}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;font-size:calc(14px*var(--fs));font-weight:500}
.seg button[aria-pressed=true]{background:var(--sc);color:var(--on-sc)}
.appbar{display:flex;align-items:center;gap:8px;min-height:64px;padding:0 8px 0 20px;flex:none}
.appbar .tl{flex:1}
.iconbtn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:24px}

/* nav bar (A) */
.nav{display:flex;flex:none;background:var(--surf);height:80px;padding-top:12px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(12px*var(--fs));font-weight:500;color:var(--var)}
.nav button span.pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav button[aria-current=page]{color:var(--on)}
.nav button[aria-current=page] span.pill{background:var(--pc);color:var(--on-pc)}

/* grid + tiles */
.gh{padding:20px 16px 8px;font-size:calc(14px*var(--fs));font-weight:500;color:var(--var);position:sticky;top:0;background:var(--bg);z-index:2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surf);border-radius:2px;display:block;padding:0}
.tile svg.sc{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:12px;background:var(--scrim);color:#fff;display:flex;align-items:center;justify-content:center}
.badge svg{width:15px;height:15px;stroke-width:2.2}
.vid{position:absolute;left:5px;bottom:5px;height:22px;padding:0 7px;border-radius:11px;background:var(--scrim);color:#fff;font-size:11px;display:flex;align-items:center;gap:3px;font-weight:500}
.vid svg{width:10px;height:10px;fill:#fff;stroke:none}
.legend{padding:12px 16px 24px;color:var(--var);display:flex;gap:8px;align-items:center}
.legend .badge{position:static;flex:none}
.sample{padding:10px 16px 0;color:var(--var)}

/* status panel pieces */
.card{background:var(--surf);border-radius:20px;padding:20px}
.card.warn{background:var(--warn);color:var(--on-warn)}
.card.err{background:var(--errc);color:var(--on-errc)}
.stack{display:flex;flex-direction:column;gap:16px}
.pad{padding:8px 20px 24px}
.strip{margin:0 12px 6px;border-radius:16px;padding:12px 12px 12px 16px;background:var(--pc);color:var(--on-pc);display:flex;flex-direction:column;gap:8px}
.strip.warn{background:var(--warn);color:var(--on-warn)}
.strip.err{background:var(--errc);color:var(--on-errc)}
.strip.idle{background:var(--surf);color:var(--on)}
.strip .top{display:flex;align-items:center;gap:12px}
.strip .top>div{flex:1;min-width:0}
.strip .prog{background:#0002}
.strip .prog>i{background:currentColor}

/* month rows (C) */
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:88px}
.mrow:active{background:var(--surf)}
.mrow .strip4{display:flex;gap:2px;width:112px;flex:none;border-radius:10px;overflow:hidden}
.mrow .strip4 span{position:relative;width:28px;height:56px;display:block}
.mrow .strip4 svg{position:absolute;inset:0;width:100%;height:100%}
.mrow .tx{flex:1;min-width:0}
.mstate{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-weight:500;font-size:calc(14px*var(--fs))}
.mstate.ok{color:var(--p)}
.mstate.wait{color:var(--on-warn);background:var(--warn);padding:2px 10px 2px 6px;border-radius:10px}
.mstate.bad{color:var(--on-errc);background:var(--errc);padding:2px 10px 2px 6px;border-radius:10px}
.drivecard{margin:4px 16px 8px}
.cap{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surf-hi);margin:12px 0 8px}
.cap i{display:block;height:100%}
.cap i.a{background:var(--p)}.cap i.b{background:var(--warn);outline:1px solid var(--on-warn);outline-offset:-1px}

/* viewer */
.viewer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column}
.fresh{animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.viewer .photo{position:relative;flex:1;min-height:0;overflow:hidden}
.viewer .photo svg.sc{position:absolute;inset:0;width:100%;height:100%}
.viewer.A{background:#0b0f0f;color:#eef}
.viewer.A .photo{flex:1}
.viewer.A .sheet{background:var(--bg);color:var(--on);border-radius:28px 28px 0 0;padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px}
.viewer.A .top{position:absolute;left:4px;top:4px;z-index:2;color:#fff}
.viewer.A .top .iconbtn{background:var(--scrim)}
.viewer.B{background:#000;color:#fff}
.viewer.B .top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;padding:6px 8px;background:linear-gradient(#000a,#0000)}
.viewer.B .bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#0000,#000b 40%);padding-top:56px}
.viewer.B .chip{background:var(--scrim);color:#fff;align-self:flex-start}
.viewer.C{background:var(--bg);color:var(--on)}
.viewer.C .photo{flex:none;height:380px}
.viewer.C .top{position:absolute;left:4px;top:4px;z-index:2;color:#fff}
.viewer.C .top .iconbtn{background:var(--scrim)}
.viewer.C .info{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--var)}
.loadcard{border-radius:20px;padding:16px;background:var(--surf);color:var(--on);display:flex;flex-direction:column;gap:12px}
.viewer.B .loadcard{background:#1d2424;color:#eef}
.viewer.B .btn.tonal{background:#cce8e5;color:#05201e}
.hint{display:flex;gap:10px;align-items:flex-start}

/* sheet (free up space) + toast */
.dim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.bsheet{background:var(--bg);width:100%;border-radius:28px 28px 0 0;padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:30;background:#2b3333;color:#eef;border-radius:8px;padding:14px 16px;font-size:calc(14px*var(--fs))}
body[data-theme=dark] .toast{background:#dde4e3;color:#162020}

/* variant switcher */
#sw{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 6px 22px #0006}
#sw button{width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px;line-height:1}
#sw button:hover{background:#333}
#sw span{padding:0 10px;min-width:210px;text-align:center;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside id="panel" aria-label="Prototype controls">
  <h2>Prototype controls, not part of the app</h2>
  <h3>Jump to a state</h3>
  <div class="row" id="presets"></div>
  <h3>Hardware</h3>
  <button class="big" data-act="plug" id="plugbtn"></button>
  <h3>Options</h3>
  <label><input type="checkbox" data-opt="build1"> Build 1: hide "Free up space"</label>
  <label><input type="checkbox" data-opt="failNext"> Next backup: 2 files fail verification</label>
  <label><input type="checkbox" data-opt="big"> Large text (130%)</label>
  <label><input type="checkbox" data-opt="dark"> Dark theme</label>
  <h3>State</h3>
  <pre id="dump"></pre>
  <p class="note">Photos are drawn placeholders. Grids show a sample of each month; counts are made up (1,204 backed up + 142 new).</p>
</aside>

<div id="stage"><div id="phone"><div id="screen"></div></div></div>

<div id="sw" role="group" aria-label="Variant switcher">
  <button data-act="prev" aria-label="Previous variant">&larr;</button>
  <span id="swl"></span>
  <button data-act="next" aria-label="Next variant">&rarr;</button>
</div>

<script>
/* ============ data ============ */
const VARIANTS = {A:'One thing at a time', B:'Photos first', C:'By month'};
const MONTHS = [
  {k:'2026-10',name:'October 2026',short:'Oct',count:142,idx:9,n:18},
  {k:'2026-09',name:'September 2026',short:'Sep',count:247,idx:8,n:12},
  {k:'2026-08',name:'August 2026',short:'Aug',count:405,idx:7,n:12},
  {k:'2026-07',name:'July 2026',short:'Jul',count:340,idx:6,n:12},
  {k:'2026-06',name:'June 2026',short:'Jun',count:212,idx:5,n:12},
];
const PALS=[['#F6C177','#EB8F5A','#2F5D62','#1D3B3F'],['#BFE3F5','#8CC4E8','#4C8C5B','#2E5E3B'],['#2B3A67','#6D5C9C','#E07A5F','#1B1F3B'],['#F4E3C1','#E0B88B','#8A6F5A','#5C4636'],['#CFE8D5','#9BCBA7','#3D7A66','#245244'],['#FFD6C0','#F4A6A0','#7C6A9B','#4B3F72']];
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const sceneCache={};
function scene(id){
  if(sceneCache[id])return sceneCache[id];
  const r=rng(id*7919+13),p=PALS[Math.floor(r()*PALS.length)];
  const sx=15+r()*70,sy=14+r()*26,sr=7+r()*8;
  const h1=48+r()*22,h2=64+r()*18;
  const hill=(y,a)=>`M0 ${y} Q ${20+r()*20} ${y-a} 50 ${y-a/3} T 100 ${y-a/2} V100 H0Z`;
  const bld=r()>.55?`<rect x="${58+r()*22}" y="${h1-10}" width="${9+r()*6}" height="${14}" fill="${p[3]}" opacity=".85"/>`:'';
  const svg=`<svg class="sc" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g${id})"/><circle cx="${sx}" cy="${sy}" r="${sr}" fill="#fff" opacity=".8"/><path d="${hill(h1,16)}" fill="${p[2]}"/>${bld}<path d="${hill(h2,12)}" fill="${p[3]}"/></svg>`;
  return sceneCache[id]=svg;
}
const ITEMS=[];
(function(){
  let id=1;
  for(const m of MONTHS){
    for(let i=0;i<m.n;i++){
      const day=Math.max(1,28-Math.floor(i*(m.n>12?1.4:2.2)));
      const isVid=((id*37)%9)===0;
      const d=new Date(2026,m.idx,Math.min(day,m.k==='2026-10'?11:28),9+(id%9),(id*13)%60);
      ITEMS.push({id:id++,m:m.k,mi:i,date:d,vid:isVid,
        mb:isVid?Math.round(60+((id*17)%120)):+(3.2+((id*7)%36)/10).toFixed(1),
        dur:isVid?`0:${String(8+(id%40)).padStart(2,'0')}`:null,
        onPhone:m.k==='2026-10'||(m.k==='2026-09'&&i<5)});
    }
  }
})();
const byId=id=>ITEMS.find(x=>x.id===id);
const fmtDay=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtLong=d=>d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'});

/* ============ icons ============ */
const P={
 drive:'<rect x="3" y="12" width="18" height="8" rx="2"/><path d="M5 12l2-7h10l2 7"/><path d="M16.5 16h.01" stroke-width="3"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 pause:'<path d="M9 6v12M15 6v12"/>',
 play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
 photos:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-5 4 4 3-3 6 6"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
 refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>',
 plug:'<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 01-10 0zM12 16v5"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''} aria-hidden="true">${P[n]}</svg>`;

/* ============ state ============ */
const TOTAL=1346, BASE=1204;
const q=new URLSearchParams(location.search);
const S={
  variant:['A','B','C'].includes(q.get('variant'))?q.get('variant'):'A',
  drive:'out',phase:'idle',pausedBy:null,newTotal:142,copied:0,failed:0,
  loads:{},tab:'home',group:'month',month:null,photo:null,sheet:null,toast:null,preset:'out',
  opts:{build1:true,failNext:false,big:false,dark:false},
};
const PRESETS=[
 ['out','Drive not connected, 142 new waiting'],
 ['ready','Drive connected, ready to back up'],
 ['copying','Backing up (48 of 142)'],
 ['pulled','Drive pulled mid-backup'],
 ['verify','Verification failed on 2 files'],
 ['done','All backed up'],
];
function applyPreset(k){
  S.preset=k;S.sheet=null;S.toast=null;S.loads={};
  Object.assign(S,{drive:'in',phase:'idle',pausedBy:null,newTotal:142,copied:0,failed:0});
  if(k==='out')S.drive='out';
  if(k==='copying'){S.phase='copying';S.copied=48}
  if(k==='pulled'){S.drive='out';S.phase='paused';S.pausedBy='pulled';S.copied=48}
  if(k==='verify'){S.phase='verifyFail';S.copied=140;S.failed=2}
  if(k==='done'){S.phase='done';S.copied=142}
  render();
}

/* ============ derived ============ */
const left=()=>S.newTotal-S.copied-S.failed;
function status(){
  const drive=S.drive==='in', L=left(), total=S.newTotal;
  if(S.phase==='copying')return{tone:'busy',title:`Backing up… ${S.copied} of ${total}`,sub:'Keep your drive plugged in.',progress:S.copied/total,pause:true};
  if(S.phase==='paused'){
    const prog=S.copied/total;
    if(!drive)return{tone:'warn',title:'Your drive was unplugged',sub:`${S.copied} of ${total} are safe on it. Plug it back in to continue.`,progress:prog,primary:{label:'Waiting for your drive',disabled:true}};
    if(S.pausedBy==='pulled')return{tone:'idle',title:'Your drive is back',sub:`Continue where you left off: ${S.copied} of ${total} are done.`,progress:prog,primary:{label:'Continue',act:'resume'}};
    return{tone:'idle',title:`Paused at ${S.copied} of ${total}`,sub:'Nothing is lost. Continue when you like.',progress:prog,primary:{label:'Continue',act:'resume'}};
  }
  if(S.phase==='verifyFail')return{tone:'err',title:`${S.copied} backed up, ${S.failed} need another try`,sub:'Those 2 are still on your phone. Nothing was lost.',primary:{label:'Try again',act:'retry',icon:'refresh'}};
  if(S.phase==='done'||L<=0)return{tone:'ok',title:`All ${TOTAL.toLocaleString()} photos are backed up`,sub:drive?'Checked just now.':'Plug in your drive after you take more photos.',done:true,free:!S.opts.build1};
  return drive
   ?{tone:'idle',title:`${L} new photos to back up`,sub:`3.6 GB · about ${Math.round(L*.28)} minutes`,primary:{label:'Back up now',act:'backup',icon:'drive'}}
   :{tone:'idle',title:`${L} new photos waiting`,sub:'Plug in your drive to back them up.',primary:{label:'Plug in your drive',disabled:true,icon:'plug'}};
}
function monthState(m){
  if(m.k!=='2026-10')return{kind:'ok',text:'All backed up'};
  if(S.failed)return{kind:'bad',text:`${S.failed} need another try`};
  if(S.phase==='done'||left()<=0)return{kind:'ok',text:'All backed up'};
  if(S.copied>0)return{kind:'wait',text:`${S.copied} of ${S.newTotal} backed up`};
  return{kind:'wait',text:`${S.newTotal} not backed up yet`};
}
function where(it){
  if(S.loads[it.id]&&S.loads[it.id].s==='done')return'Original loaded to your phone';
  if(!it.onPhone)return'Original is on your drive';
  const frac=S.phase==='done'||left()<=0?1:S.copied/S.newTotal;
  const backed=it.m!=='2026-10'||(17-it.mi)<Math.round(frac*18);
  return backed?'Safe on your drive and on your phone':'Only on your phone so far';
}

/* ============ small renderers ============ */
const primaryBtn=(p,cls='')=>p?`<button class="btn ${cls}" ${p.disabled?'disabled':`data-act="${p.act}"`}>${p.icon?ic(p.icon):''}${p.label}</button>`:'';
const prog=f=>`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f*100)}"><i style="width:${Math.round(f*100)}%"></i></div>`;
const driveChip=()=>S.drive==='in'
  ?`<span class="chip ok">${ic('drive',20)}Drive connected</span>`
  :`<span class="chip">${ic('plug',20)}Drive not connected</span>`;
function tile(it){
  const off=!it.onPhone&&!(S.loads[it.id]&&S.loads[it.id].s==='done');
  return `<button class="tile" data-act="photo" data-id="${it.id}" aria-label="${it.vid?'Video':'Photo'}, ${fmtDay(it.date)}${off?', Original is on your drive':''}">${scene(it.id)}${it.vid?`<span class="vid"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${it.dur}</span>`:''}${off?`<span class="badge" aria-hidden="true">${ic('drive')}</span>`:''}</button>`;
}
function grouped(items,mode){
  const groups=[];
  for(const it of items){
    const key=mode==='day'?fmtDay(it.date):MONTHS.find(m=>m.k===it.m).name;
    const g=groups[groups.length-1];
    if(g&&g.key===key)g.items.push(it);else groups.push({key,items:[it]});
  }
  return groups.map(g=>`<div class="gh">${g.key}</div><div class="grid">${g.items.map(tile).join('')}</div>`).join('')
   +`<div class="legend lm"><span class="badge">${ic('drive')}</span><span>Original is on your drive. Tap a photo to Load it.</span></div>`;
}
const freeBtn=st=>st.free?`<button class="btn tonal" data-act="freeStart">Free up space</button>`:'';

/* ============ variant A: one thing at a time ============ */
function A(){
  const st=status();
  const home=`<div class="pad stack">
    <div>${driveChip()}</div>
    <div class="stack" style="gap:12px">
      <h1 class="hs">${st.title}</h1>
      <p class="bl var">${st.sub}</p>
    </div>
    ${st.progress!=null?prog(st.progress):''}
    ${primaryBtn(st.primary)}
    ${st.pause?`<button class="btn tonal" data-act="pause">${ic('pause')}Pause</button>`:''}
    ${freeBtn(st)}
    <button class="card" style="display:flex;align-items:center;gap:12px;text-align:left;width:100%" data-act="tab" data-t="photos">
      ${ic('photos')}<div style="flex:1"><div class="tm">Your photos</div><div class="bm var">${(BASE+S.copied).toLocaleString()} backed up on your drive</div></div>${ic('chev')}
    </button>
  </div>`;
  const photos=`<div class="appbar"><h2 class="tl">Photos</h2><div class="seg" role="group" aria-label="Group by"><button data-act="group" data-g="month" aria-pressed="${S.group==='month'}">Months</button><button data-act="group" data-g="day" aria-pressed="${S.group==='day'}">Days</button></div></div>
    ${grouped(ITEMS,S.group)}`;
  return `${S.tab==='home'?'<div class="appbar"><h2 class="tl">Photoxpo</h2></div>':''}
   <div class="scroll" id="sc">${S.tab==='home'?home:photos}</div>
   <nav class="nav" aria-label="Main">
     <button data-act="tab" data-t="home" ${S.tab==='home'?'aria-current="page"':''}><span class="pill">${ic('home')}</span>Home</button>
     <button data-act="tab" data-t="photos" ${S.tab==='photos'?'aria-current="page"':''}><span class="pill">${ic('photos')}</span>Photos</button>
   </nav>`;
}

/* ============ variant B: photos first ============ */
function B(){
  const st=status();
  const cls=st.tone==='warn'?'warn':st.tone==='err'?'err':st.tone==='idle'||st.tone==='ok'&&false?'idle':'';
  const toneCls=st.tone==='ok'?'':cls;
  const icon=st.tone==='warn'?'plug':st.tone==='err'?'alert':st.tone==='ok'?'check':st.tone==='busy'?'drive':'drive';
  let action='';
  if(st.primary&&!st.primary.disabled)action=`<button class="btn sm" data-act="${st.primary.act}">${st.primary.label}</button>`;
  if(st.pause)action=`<button class="btn sm tonal" data-act="pause">Pause</button>`;
  if(st.free)action=`<button class="btn sm tonal" data-act="freeStart">Free up space</button>`;
  const strip=`<div class="strip ${toneCls||(st.tone==='idle'?'idle':'')}" role="status">
    <div class="top">${ic(icon)}<div><div class="tm">${st.title}</div><div class="bm" style="opacity:.85">${st.sub}</div></div>${action}</div>
    ${st.progress!=null?prog(st.progress):''}</div>`;
  return `<div class="appbar"><h2 class="tl">Photos</h2><div class="seg" role="group" aria-label="Group by"><button data-act="group" data-g="month" aria-pressed="${S.group==='month'}">Months</button><button data-act="group" data-g="day" aria-pressed="${S.group==='day'}">Days</button></div></div>
   ${strip}
   <div class="scroll" id="sc">${grouped(ITEMS,S.group)}</div>`;
}

/* ============ variant C: by month ============ */
function C(){
  const st=status();
  if(S.month){
    const m=MONTHS.find(x=>x.k===S.month);
    const ms=monthState(m);
    return `<div class="appbar" style="padding-left:4px"><button class="iconbtn" data-act="closeMonth" aria-label="Back">${ic('back')}</button><h2 class="tl">${m.name}</h2></div>
     <div class="scroll" id="sc"><div style="padding:0 16px 12px"><span class="mstate ${ms.kind}">${ms.kind==='ok'?ic('check',18):ic(ms.kind==='bad'?'alert':'drive',18)}${ms.text}</span> <span class="bm var">· ${m.count} items</span></div>
     <div class="grid">${ITEMS.filter(i=>i.m===m.k).map(tile).join('')}</div><p class="sample bm">Showing ${m.n} of ${m.count} (sample).</p>
     <div class="legend lm"><span class="badge">${ic('drive')}</span><span>Original is on your drive. Tap a photo to Load it.</span></div></div>`;
  }
  const backedFrac=(BASE+S.copied)/TOTAL;
  const waiting=S.newTotal-S.copied-S.failed;
  const card=`<div class="card drivecard ${st.tone==='warn'?'warn':st.tone==='err'?'err':''}">
    <div style="display:flex;align-items:center;gap:12px">${ic(S.drive==='in'?'drive':'plug',28)}<div style="flex:1"><div class="tm">${S.drive==='in'?'Your drive is connected':'Your drive is not connected'}</div></div></div>
    <div class="cap" role="img" aria-label="${BASE+S.copied} on your drive, ${waiting} waiting"><i class="a" style="width:${backedFrac*100}%"></i><i class="b" style="width:${Math.max(0,waiting)/TOTAL*100}%"></i></div>
    <div class="bm" style="opacity:.9;margin-bottom:12px">${(BASE+S.copied).toLocaleString()} backed up · ${Math.max(0,waiting)} waiting${S.failed?` · ${S.failed} to retry`:''}</div>
    <div class="tl" style="margin-bottom:4px;font-size:calc(20px*var(--fs))">${st.title}</div>
    <p class="bm" style="opacity:.9;margin-bottom:${st.primary||st.pause||st.free?'16px':'0'}">${st.sub}</p>
    ${primaryBtn(st.primary)}${st.pause?`<button class="btn tonal" data-act="pause">${ic('pause')}Pause</button>`:''}${freeBtn(st)}
  </div>`;
  const rows=MONTHS.map(m=>{
    const ms=monthState(m);
    const th=ITEMS.filter(i=>i.m===m.k).slice(0,4).map(i=>`<span>${scene(i.id)}</span>`).join('');
    return `<button class="mrow" data-act="month" data-k="${m.k}"><div class="strip4">${th}</div><div class="tx"><div class="tm">${m.name}</div><div class="bm var">${m.count} items</div><span class="mstate ${ms.kind}">${ms.kind==='ok'?ic('check',18):ic(ms.kind==='bad'?'alert':'drive',18)}${ms.text}</span></div>${ic('chev')}</button>`;
  }).join('');
  return `<div class="appbar"><h2 class="tl">Photoxpo</h2></div><div class="scroll" id="sc">${card}${rows}</div>`;
}

/* ============ viewer (Preview + Load) ============ */
function viewer(){
  const it=byId(S.photo);if(!it)return'';
  const ld=S.loads[it.id]||{s:'idle',pct:0};
  const needLoad=!it.onPhone&&ld.s!=='done';
  const drive=S.drive==='in';
  const size=it.mb>=100?`${it.mb} MB`:`${it.mb} MB`;
  let load='';
  if(needLoad){
    if(ld.s==='loading')load=`<div class="loadcard" role="status"><div class="tm">Loading Original… ${Math.round(ld.pct)}%</div>${prog(ld.pct/100)}<button class="btn tonal sm" style="align-self:flex-start" data-act="cancelLoad" data-id="${it.id}">Cancel</button></div>`;
    else if(ld.s==='error')load=`<div class="loadcard" role="alert" style="background:var(--errc);color:var(--on-errc)"><div class="hint">${ic('alert')}<div><div class="tm">Your drive was unplugged</div><div class="bm">Plug it back in, then try again. Nothing was changed on your phone.</div></div></div>${drive?`<button class="btn" data-act="load" data-id="${it.id}">${ic('refresh')}Try again</button>`:`<button class="btn" disabled>${ic('plug')}Waiting for your drive</button>`}</div>`;
    else if(drive)load=`<button class="btn" data-act="load" data-id="${it.id}">${ic('down')}Load Original · ${size}</button>`;
    else load=`<div class="loadcard"><button class="btn" disabled>${ic('plug')}Connect your drive to Load</button><div class="hint bm">${ic('info',20)}<span>This photo's Original is only on your drive. This small Preview is what your phone keeps.</span></div></div>`;
  }else if(ld.s==='done'){
    load=`<div class="loadcard" role="status"><div class="hint">${ic('check')}<div><div class="tm">Loaded</div><div class="bm">Find it in Gallery, in the Photoxpo Loaded album.</div></div></div></div>`;
  }
  const w=where(it);
  const head=`${it.vid?'Video':'Photo'} · ${fmtDay(it.date)}`;
  const photo=`<div class="photo">${scene(it.id)}${it.vid?`<span class="vid" style="left:auto;right:12px;bottom:12px">${'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}${it.dur}</span>`:''}</div>`;
  const close=`<button class="iconbtn" data-act="closeViewer" aria-label="Back">${ic('back')}</button>`;
  if(S.variant==='A')return `<div class="viewer A ${fresh('v')}"><div class="top">${close}</div>${photo}<div class="sheet"><div><div class="tm">${head}</div><div class="bm var">${w}</div></div>${load}</div><div class="gesture" style="background:var(--bg)"><b></b></div></div>`;
  if(S.variant==='B')return `<div class="viewer B ${fresh('v')}"><div class="top">${close}<div class="tm" style="margin-left:4px">${head}</div></div>${photo}<div class="bottom"><span class="chip">${ic(needLoad?'drive':'check',20)}${w}</span>${load}</div></div>`;
  return `<div class="viewer C ${fresh('v')}"><div class="top">${close}</div>${photo}<div class="info"><div class="tl">${head}</div>${load}<dl class="kv bm"><dt>Taken</dt><dd>${fmtLong(it.date)}</dd><dt>Original</dt><dd>${size}</dd><dt>Where</dt><dd>${w}</dd></dl></div></div>`;
}

/* ============ overlays ============ */
function sheet(){
  if(!S.sheet)return'';
  const n=BASE+S.copied;
  if(S.sheet==='free1')return `<div class="dim"><div class="bsheet ${fresh('s')}" role="dialog" aria-label="Free up space">
    <h2 class="tl">Free up space on this phone?</h2>
    <p class="bl">${n.toLocaleString()} photos and videos are safely on your drive and checked. This removes their big Originals from your phone. The small Previews stay, and you can Load any Original later.</p>
    <p class="bm var">Android will ask you to confirm before anything is removed.</p>
    <button class="btn" data-act="freeConfirm">Remove ${n.toLocaleString()} Originals · 38 GB</button>
    <button class="btn text" style="align-self:center" data-act="freeClose">Not now</button></div></div>`;
  return `<div class="dim"><div class="bsheet ${fresh('s')}" role="dialog" aria-label="Done">
    <div style="display:flex;gap:12px;align-items:center">${ic('check',32)}<h2 class="tl">38 GB freed</h2></div>
    <p class="bl">Your phone has more room. Your photos are all still here as Previews.</p>
    <button class="btn" data-act="freeClose">Done</button></div></div>`;
}
const toast=()=>S.toast?`<div class="toast ${fresh('t')}" role="status">${S.toast}</div>`:'';

/* ============ render ============ */
const ANIM=new Set();
const fresh=k=>ANIM.has(k)?'fresh':'';
function render(){
  document.body.dataset.theme=S.opts.dark?'dark':'light';
  document.documentElement.style.setProperty('--fs',S.opts.big?1.3:1);
  const scr=document.getElementById('screen');
  const old=scr.querySelector('#sc'); const top=old?old.scrollTop:0;
  scr.innerHTML=`<div class="sb"><span>9:41</span><span>5G<i></i></span></div>`
    +(S.variant==='A'?A():S.variant==='B'?B():C())
    +`<div class="gesture"><b></b></div>`+viewer()+sheet()+toast();
  ANIM.clear();
  const nw=scr.querySelector('#sc'); if(nw)nw.scrollTop=top;
  document.getElementById('swl').textContent=`${S.variant} (${VARIANTS[S.variant]})`;
  document.getElementById('plugbtn').textContent=S.drive==='in'?'Unplug the drive':'Plug in the drive';
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===S.preset)));
  document.querySelectorAll('[data-opt]').forEach(c=>c.checked=!!S.opts[c.dataset.opt]);
  const {loads,...rest}=S;
  document.getElementById('dump').textContent=JSON.stringify({variant:S.variant,drive:S.drive,phase:S.phase,pausedBy:S.pausedBy,copied:S.copied,failed:S.failed,waiting:Math.max(0,left()),screen:S.photo?`photo ${S.photo}`:S.month?`month ${S.month}`:S.variant==='A'?S.tab:'list',loads:Object.fromEntries(Object.entries(loads).map(([k,v])=>[k,v.s+(v.s==='loading'?' '+Math.round(v.pct)+'%':'')]))},null,1);
}
function setVariant(v){S.variant=v;S.photo=null;S.month=null;S.tab='home';const u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(d){const k=Object.keys(VARIANTS);setVariant(k[(k.indexOf(S.variant)+d+k.length)%k.length])}
function say(t){S.toast=t;ANIM.add('t');render();clearTimeout(say.t);say.t=setTimeout(()=>{S.toast=null;render()},2600)}

/* ============ actions ============ */
const ACT={
  prev:()=>cycle(-1),next:()=>cycle(1),
  tab:d=>{S.tab=d.t;render()},group:d=>{S.group=d.g;render()},
  month:d=>{S.month=d.k;render()},closeMonth:()=>{S.month=null;render()},
  photo:d=>{S.photo=+d.id;ANIM.add('v');render()},closeViewer:()=>{S.photo=null;render()},
  backup:()=>{if(S.drive!=='in')return;S.phase='copying';S.pausedBy=null;render()},
  pause:()=>{S.phase='paused';S.pausedBy='user';render()},
  resume:()=>{if(S.drive!=='in')return;S.phase='copying';S.pausedBy=null;render()},
  retry:()=>{S.failed=0;S.phase='copying';render()},
  plug:()=>{
    S.drive=S.drive==='in'?'out':'in';
    if(S.drive==='out'){
      if(S.phase==='copying'){S.phase='paused';S.pausedBy='pulled'}
      for(const k in S.loads)if(S.loads[k].s==='loading')S.loads[k]={s:'error',pct:S.loads[k].pct};
    }
    render();
  },
  load:d=>{if(S.drive!=='in')return;S.loads[d.id]={s:'loading',pct:0};render()},
  cancelLoad:d=>{delete S.loads[d.id];render()},
  freeStart:()=>{S.sheet='free1';ANIM.add('s');render()},freeConfirm:()=>{S.sheet='free2';ANIM.add('s');render()},freeClose:()=>{S.sheet=null;render()},
};
document.addEventListener('click',e=>{
  const p=e.target.closest('#presets button');if(p){applyPreset(p.dataset.p);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset);
});
document.addEventListener('change',e=>{
  const o=e.target.dataset&&e.target.dataset.opt;if(!o)return;
  S.opts[o]=e.target.checked;render();
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;
  if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);
});

/* ============ simulation tick ============ */
setInterval(()=>{
  let dirty=false;
  if(S.phase==='copying'&&S.drive==='in'){
    const stop=S.opts.failNext?S.newTotal-2:S.newTotal;
    S.copied=Math.min(stop,S.copied+3);
    if(S.opts.failNext&&S.copied>=stop){S.failed=2;S.phase='verifyFail';S.opts.failNext=false}
    else if(S.copied>=S.newTotal){S.phase='done'}
    dirty=true;
  }
  for(const k in S.loads){
    const l=S.loads[k];
    if(l.s==='loading'){l.pct=Math.min(100,l.pct+4);if(l.pct>=100){l.s='done';say('Loaded to Photoxpo Loaded');}dirty=true}
  }
  if(dirty)render();
},250);

/* ============ boot ============ */
document.getElementById('presets').innerHTML=PRESETS.map(([k,l])=>`<button class="pre" data-p="${k}" aria-pressed="false">${l}</button>`).join('');
function fit(){
  const k=Math.min(1,(innerHeight-90)/892,(innerWidth-32)/412);
  const st=document.getElementById('stage');
  st.style.transform=`scale(${k})`;st.style.marginBottom=`${(k-1)*892}px`;st.style.width=`${412}px`;
}
addEventListener('resize',fit);fit();
render();
</script>
</body>
</html>
